name: Viewer quality
on:
  pull_request:
  push:
    branches: [master, 'refactor/**', 'feature/**']
permissions:
  contents: read
concurrency:
  group: viewer-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    # Browser installation and all seven browser/device projects share this budget.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run audit:prod
      - run: npm run build
      - run: npm run test:http
      - run: git diff --check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: viewer-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
