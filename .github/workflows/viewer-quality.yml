name: Viewer quality
on:
  pull_request:
  push:
    branches: [master, 'refactor/**', 'feature/**']
permissions:
  contents: read
concurrency:
  group: viewer-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  roku:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: roku/package-lock.json
      - run: npm --prefix roku ci
      - run: npm --prefix roku audit
      - run: npm --prefix roku run build
      - uses: actions/upload-artifact@v6
        with:
          name: tates-tv-roku-beta
          path: roku/dist/tates-tv-roku.zip
          if-no-files-found: error
          retention-days: 14
  verify:
    runs-on: ubuntu-24.04
    # Includes the exact browsers and Linux libraries required by the lockfile.
    # Avoid downloading Ubuntu packages from the runner's unavailable APT mirror.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      # Match the owner of GitHub's mounted home/workspace directories. Firefox
      # refuses to run as root with the runner-owned /github/home directory.
      options: --init --ipc=host --user 1001
    defaults:
      run:
        shell: bash
    env:
      TTV_CI_PLAYWRIGHT_VERSION: "1.63.0"
    # All seven browser/device projects still run within this budget.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify preinstalled test browsers
        timeout-minutes: 2
        run: node scripts/verify-ci-browsers.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm audit
      - run: npm run build
      - run: npm run test:http
      - run: git diff --check
      - name: Check theme, admin and commercial flows first
        # Exercise every browser engine before repeating the full catalogue.
        # The complete seven-device suite still runs after these checks pass.
        run: >-
          npx playwright test tests/viewer.browser.ts tests/admin-login.browser.ts tests/accounts.browser.ts tests/commercials.browser.ts
          --project=chromium-desktop --project=firefox-desktop --project=webkit-desktop --project=iphone
          --grep "ttv-neon-crt applies|Christmas '96 carries|mobile themes are free|administrator|commercial campaign saves"
          --max-failures=1 --output=test-results-smoke
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-smoke
      - run: npm run test:browser
      - name: Build with paid themes enabled
        # Recompile the browser bundle with the new build-time billing flag.
        run: |
          rm -r .next
          npm run build
        env:
          NEXT_PUBLIC_THEME_BILLING_ENABLED: "true"
      - name: Verify paid theme access
        run: npx playwright test tests/accounts.browser.ts --grep @billing --output=test-results-billing
        env:
          NEXT_PUBLIC_THEME_BILLING_ENABLED: "true"
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-billing
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: viewer-browser-smoke-report
          path: |
            playwright-report-smoke/
            test-results-smoke/
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: viewer-browser-report
          path: |
            playwright-report/
            playwright-report-billing/
          retention-days: 14
      # Keep the self-contained HTML report and raw output separate. Combining
      # both duplicates trace data and exceeded the report download size limit.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: viewer-browser-raw-results
          path: |
            test-results/
            test-results-billing/
          retention-days: 14
