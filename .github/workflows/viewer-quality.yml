name: Viewer quality
on:
  pull_request:
  push:
    branches: [master, refactor/premium-v1, feature/daily-tv-experience]
permissions:
  contents: read
concurrency:
  group: viewer-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run audit:prod
      - run: npm run build
      - run: npm run test:http
      - run: git diff --check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
