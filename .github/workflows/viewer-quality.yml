name: Viewer quality
on:
  pull_request:
  push:
    branches: [master, 'refactor/**', 'feature/**']
permissions:
  contents: read
concurrency:
  group: viewer-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    # Browser installation and all seven browser/device projects share this budget.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run audit:prod
      - run: npm run build
      - run: npm run test:http
      - run: git diff --check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - name: Build with paid themes enabled
        # Recompile the browser bundle with the new build-time billing flag.
        run: |
          rm -r .next
          npm run build
        env:
          NEXT_PUBLIC_THEME_BILLING_ENABLED: "true"
      - name: Verify paid theme access
        run: npx playwright test tests/accounts.browser.ts --grep @billing --output=test-results-billing
        env:
          NEXT_PUBLIC_THEME_BILLING_ENABLED: "true"
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-billing
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: viewer-browser-report
          path: |
            playwright-report/
            test-results/
            playwright-report-billing/
            test-results-billing/
          retention-days: 14
